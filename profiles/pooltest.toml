# [I] Fork #21 shared SRAM_L pool measurement (device, with make OT_POOL_TEST=1):
# synths built in that the card copies replace (OT_POOL_TEST), to read the same
# synth from flash, from the SRAM_U pool and with its hot part in SRAM_L. No VAP /
# FAT: their .fastrun room in SRAM_L goes to the 12 KB fast block. DX7 is a core
# engine (built in). Test songs 23-28 (tools/make_testsongs/poolsong.inc).
# Paths are relative to MODULES_DIR (default: ../../opentracker-synths from reimpl/).
name = "pooltest"
variant = "p"                 # image PolyendTrackerOTp<ver>.ptf (24 characters)
display_name = "Pool test"
flash_modules_max = 125000
slot_inserts = false

modules = [
    { id = "ACD1", path = "modules/acd" },
    { id = "PRC1", path = "modules/perc" },
    { id = "FM4S", path = "modules/fm4" },
    { id = "CST1", path = "modules/cstype" },
    { id = "8TY1", path = "modules/eight" },
    { id = "TAPE", path = "../opentracker-fx/modules/tape" },
]
