# [I] Device test: the full profile without the acid bass (ACD1) and Tape,
# which load from the card instead, with FM4S (not in full) as a card-only synth:
#   make otm OTM_MODULE=modules/acd; make otm OTM_MODULE=modules/fm4
#   make otm OTM_MODULE=../opentracker-fx/modules/tape; copy the .otm files to Modules/.
# Paths are relative to MODULES_DIR (default: ../../opentracker-synths from reimpl/).
name = "sdtest"
variant = "s"                 # image PolyendTrackerOTs<ver>.ptf (24 characters)
display_name = "SD test"      # shown with the version: boot splash, Config, diag log
flash_modules_max = 125000     # sum of the modules' declared flash_max_bytes
slot_inserts = false           # no synth slot inserts: the stack headroom has no room for their state

modules = [
    { id = "FAT1", path = "modules/fat" },
    { id = "VAP1", path = "modules/vap" },
    { id = "PRC1", path = "modules/perc" },
    { id = "WTF1", path = "modules/wtfm" },
    # Effects (opentracker-fx, next to opentracker-synths): master inserts run in this order.
    { id = "CHOR", path = "../opentracker-fx/modules/chorus" },
    { id = "BBDC", path = "../opentracker-fx/modules/bbd" },
]
