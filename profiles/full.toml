# Build profile (docs/PLAN_3X.md §7.3): the modules this image compiles in.
# Paths are relative to MODULES_DIR (default: ../../opentracker-synths from reimpl/).
name = "full"
variant = "v"                 # image PolyendTrackerOTv<ver>.ptf (24 characters)
display_name = "Full"         # shown with the version: boot splash, Config, diag log
flash_modules_max = 125000     # sum of the modules' declared flash_max_bytes

modules = [
    { id = "ACD1", path = "modules/acd" },
    { id = "FAT1", path = "modules/fat" },
    { id = "VAP1", path = "modules/vap" },
    { id = "PRC1", path = "modules/perc" },
    { id = "WTF1", path = "modules/wtfm" },
    { id = "FM4S", path = "modules/fm4" },    # module engine 0x80 (not a Mini model)
    # Effects (opentracker-fx, next to opentracker-synths): master inserts run in this order.
    { id = "CHOR", path = "../opentracker-fx/modules/chorus" },
    { id = "BBDC", path = "../opentracker-fx/modules/bbd" },
    { id = "TAPE", path = "../opentracker-fx/modules/tape" },
]
