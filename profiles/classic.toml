# Build profile (docs/PLAN_CLASSIC.md §1): the analog-style image. The Tracker Mini
# models ACD, FAT and VAP, the one-DCO poly JU6S, the three-oscillator mono D-Type
# (DTY1), the two-layer poly CS-Type (CST1), the duophonic A-Type (ATY1), and the master chain DIRT (drive / bitcrush) -> BBDC (the BBD chorus) -> TAPE; Drive and Chorus are also the synth slot inserts. No FM synths (WTF1, FM4S), no PERC (PRC1: with
# it the image comes too close to the flash gate), no CHOR (JU6 has its chorus built in). Mini projects with a PERC or WTFM slot show "not available" here.
# Paths are relative to MODULES_DIR (default: ../../opentracker-synths from reimpl/).
name = "classic"
variant = "a"                 # image PolyendTrackerOTa<ver>.ptf (24 characters)
display_name = "Classic"      # shown with the version: boot splash, Config, diag log
flash_modules_max = 125000     # sum of the modules' declared flash_max_bytes
# [I] The shared fast pool's SRAM_L block: the room this profile's synths'
# .fastrun code took without the pool (OT_HOT_POOL=0), so the pool costs the
# stack nothing.
hot_pool_bytes = 12832

modules = [
    { id = "ACD1", path = "modules/acd" },
    { id = "FAT1", path = "modules/fat" },
    { id = "VAP1", path = "modules/vap" },
    { id = "JU6S", path = "modules/ju6" },    # module engine 0x81 (one-DCO poly)
    { id = "DTY1", path = "modules/dtype" },  # module engine 0x82 (D-Type, three-oscillator mono)
    { id = "CST1", path = "modules/cstype" }, # module engine 0x83 (CS-Type, two-layer poly)
    { id = "ATY1", path = "modules/atype" },  # module engine 0x84 (A-Type, duophonic)
    # Effects (opentracker-fx, next to opentracker-synths): the master insert.
    { id = "DIRT", path = "../opentracker-fx/modules/dirt" },
    { id = "BBDC", path = "../opentracker-fx/modules/bbd" },
    { id = "TAPE", path = "../opentracker-fx/modules/tape" },
    { id = "PHSR", path = "../opentracker-fx/modules/phaser" },   # slot insert only
    { id = "TREM", path = "../opentracker-fx/modules/tremolo" },  # slot insert only
    { id = "CRSH", path = "../opentracker-fx/modules/bitcrush" }, # slot insert only
]
